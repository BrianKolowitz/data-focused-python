[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "_site",
    "*.ipynb",
    "lectures/Week 01 - Language basics, Generating Data, Storing Data/Symbolic_regression_classification_generator.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["lectures"]
norecursedirs = ["_site"]
